<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ggcat — GeoGebra al navegador</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    /* La landing no ha de tenir overflow: hidden */
    html, body { height: auto; overflow: auto; }

    /* ── Hero ────────────────────────────────────────── */
    .landing {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.5rem 4rem;
      text-align: center;
      gap: 2rem;
    }

    .hero-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
    }
    .hero-logo svg { width: 3rem; height: 3rem; }
    .hero-logo-name {
      font-size: var(--fs-xxl);
      font-weight: 700;
      letter-spacing: -1px;
      color: var(--text);
    }
    .hero-logo-name span { color: var(--accent); }

    .hero-subtitle {
      font-size: var(--fs-lg);
      color: var(--muted);
      max-width: 38ch;
      line-height: 1.7;
    }

    /* ── Stats ───────────────────────────────────────── */
    .stats {
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    .stat {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.15rem;
    }
    .stat-num {
      font-size: var(--fs-xl);
      font-weight: 700;
      color: var(--accent);
    }
    .stat-lbl {
      font-size: var(--fs-xs);
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    /* ── CTA buttons ─────────────────────────────────── */
    .cta-group {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    .cta {
      font-family: var(--mono);
      font-size: var(--fs-md);
      font-weight: 700;
      padding: 0.65rem 1.5rem;
      border-radius: 8px;
      text-decoration: none;
      transition: filter 0.15s, transform 0.1s;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }
    .cta:active { transform: scale(0.97); }
    .cta-primary {
      background: var(--accent);
      color: #fff;
      border: 2px solid var(--accent);
    }
    .cta-primary:hover { filter: brightness(1.15); }
    .cta-secondary {
      background: transparent;
      color: var(--text);
      border: 2px solid var(--border);
    }
    .cta-secondary:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    body.light .cta-secondary { color: var(--text); }
    body.light .cta-secondary:hover { color: var(--accent); }

    /* ── Feature pills ───────────────────────────────── */
    .features {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 420px;
    }
    .feature {
      font-size: var(--fs-sm);
      padding: 0.25rem 0.65rem;
      border-radius: 999px;
      border: 1px solid var(--border);
      color: var(--muted);
      white-space: nowrap;
    }

    /* ── Responsive ──────────────────────────────────── */
    @media (max-width: 480px) {
      .hero-logo-name { font-size: var(--fs-xl); }
      .hero-subtitle  { font-size: var(--fs-md); }
      .cta            { font-size: var(--fs-md); padding: 0.55rem 1.1rem; }
      .stat-num       { font-size: var(--fs-lg); }
    }
  </style>
</head>
<body>

<!-- Tema: aplicat immediatament per evitar flash -->
<script>
  (function() {
    var saved = null;
    try { saved = localStorage.getItem('geocat-theme'); } catch(_) {}
    if (saved !== 'dark') document.body.classList.add('light');
  })();
</script>

<!-- Mode debug: si la URL és index.html?debug=1, redirigim al panell de tests del curs -->
<script>
  if (location.search.indexOf('debug=1') !== -1) {
    location.replace('curs/index.html?debug=1');
  }
</script>


<!-- ══════════════════════════════════════════════════════
     CAPÇALERA
     ══════════════════════════════════════════════════════ -->
<header class="topbar">
  <a class="logo" href="index.html" title="Inici de Ggcat">
    <span class="logo-icon">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="1.4em" height="1.4em" style="vertical-align:middle">
        <circle cx="50" cy="22" r="10" fill="#2563eb"/>
        <line x1="50" y1="32" x2="30" y2="82" stroke="#2563eb" stroke-width="6" stroke-linecap="round"/>
        <line x1="50" y1="32" x2="70" y2="82" stroke="#2563eb" stroke-width="6" stroke-linecap="round"/>
        <line x1="26" y1="72" x2="74" y2="72" stroke="#93c5fd" stroke-width="4" stroke-linecap="round"/>
      </svg>
    </span>
    <span>Ggcat</span>
  </a>

  <nav class="topbar-nav">
    <a href="curs/capitol-1.html" class="topbar-nav-link">Capítols</a>
    <a href="curs/repte-1a.html"   class="topbar-nav-link">Reptes</a>
  </nav>

  <div class="topbar-actions">
    <button id="btn-theme" class="btn btn-theme" aria-label="Canvia el tema"></button>
  </div>
</header>


<!-- ══════════════════════════════════════════════════════
     LANDING
     ══════════════════════════════════════════════════════ -->
<div class="landing">

  <!-- Logo + nom -->
  <div class="hero-logo">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
      <circle cx="50" cy="22" r="10" fill="#2563eb"/>
      <line x1="50" y1="32" x2="30" y2="82" stroke="#2563eb" stroke-width="6" stroke-linecap="round"/>
      <line x1="50" y1="32" x2="70" y2="82" stroke="#2563eb" stroke-width="6" stroke-linecap="round"/>
      <line x1="26" y1="72" x2="74" y2="72" stroke="#93c5fd" stroke-width="4" stroke-linecap="round"/>
    </svg>
    <span class="hero-logo-name">Gg<span>cat</span></span>
  </div>

  <!-- Subtítol -->
  <p class="hero-subtitle">
    Aprèn geometria dinàmica amb GeoGebra i en català.
  </p>

  <!-- Stats -->
  <div class="stats">
    <div class="stat">
      <span class="stat-num">10</span>
      <span class="stat-lbl">Capítols</span>
    </div>
    <div class="stat">
      <span class="stat-num">30</span>
      <span class="stat-lbl">Reptes</span>
    </div>
  </div>

  <!-- CTAs -->
  <div class="cta-group">
    <a href="curs/capitol-1.html" class="cta cta-primary">
      📐 Comença el curs
    </a>
  </div>

</div>


<!-- ══════════════════════════════════════════════════════
     Scripts
     ══════════════════════════════════════════════════════ -->
<script>
  // ── «Reptes» porta a l'últim repte visitat en aquest navegador ──
  // (la clau la desa curs/capitols.js a cada pàgina de repte)
  (function() {
    var id = null;
    try { id = localStorage.getItem('geocat_ultim_repte'); } catch (_) {}
    if (!id || !/^(10|[1-9])[abc]$/.test(id)) return;
    document.querySelectorAll('.topbar-nav a[href="curs/repte-1a.html"]').forEach(function(a) {
      a.setAttribute('href', 'curs/repte-' + id + '.html');
    });
  })();
</script>
<script>
  // ── Botó de tema ──────────────────────────────────────
  (function() {
    var btn = document.getElementById('btn-theme');
    if (!btn) return;

    function getTheme() {
      return document.body.classList.contains('light') ? 'light' : 'dark';
    }
    function applyTheme(t) {
      if (t === 'light') {
        document.body.classList.add('light');
        document.body.classList.remove('dark');
      } else {
        document.body.classList.remove('light');
        document.body.classList.add('dark');
      }
      btn.textContent = (t === 'light') ? '🌙' : '☀️';
      try { localStorage.setItem('geocat-theme', t); } catch(_) {}
    }

    // Inicialitza icona
    applyTheme(getTheme());

    btn.addEventListener('click', function() {
      applyTheme(getTheme() === 'light' ? 'dark' : 'light');
    });
  })();
</script>

</body>
</html>
