<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Curs de GeoGebra — Ggcat</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="curs.css">
</head>
<body>

<header class="curs-header">
  <a class="curs-header-logo" href="../index.html" title="Inici de Ggcat">
    <span class="logo-icon"></span>
    Ggcat
  </a>
  <nav class="curs-nav">
    <a href="capitol-1.html" class="active">Capítols</a>
    <a href="repte-1a.html">Reptes</a>
  </nav>
  <span class="curs-header-title">Curs de GeoGebra</span>
</header>

<div class="curs-index-hero">
  <h1>Aprèn GeoGebra de veritat<br>des del navegador</h1>
  <p>
    Capítols curts, construccions interactives i reptes amb validació automàtica.
    Tot sense instal·lar res.
  </p>
</div>

<ul class="capitols-list" id="capitols-list"></ul>

<section class="reptes-graella-wrap" id="reptes-graella" aria-label="Reptes"></section>

<script src="glossari-data.js"></script>
<script src="glossari-exemples.js"></script>
<script src="progress.js"></script>
<script src="capitols.js"></script>
<!-- Mode debug: ?debug=1 → carrega el tester automàtic en lloc de la llista normal -->
<script>
  if (location.search.indexOf('debug=1') !== -1) {
    document.write('<scr' + 'ipt src="debug-tester.js"></scr' + 'ipt>');
  }
</script>
<script>
  injectCursLogo();

  // En mode debug, debug-tester.js substitueix el contingut: no rendritzem la llista normal.
  if (location.search.indexOf('debug=1') === -1) {

    // Genera la llista de capítols i la graella de reptes
    (function renderIndex() {
      const list = document.getElementById('capitols-list');
      if (!list) return;
    const progress = getProgress();

    let html = '';

    // Capítols
    for (const c of CAPITOLS_DATA) {
      const done = c.goalId && progress[c.goalId];
      const check = done ? ' ✓' : '';
      html += `
        <li class="capitol-card">
          <a href="${c.arxiu}">
            <span class="capitol-card-num">${c.num}</span>
            <span class="capitol-card-titol">${c.titol}${check}</span>
            <span class="capitol-card-arrow">→</span>
          </a>
        </li>`;
    }

    list.innerHTML = html;

    // Reptes: una graella amb una fila per tema i tres columnes (nivells A, B, C).
    // Una casella que encara no té repte queda buida i sense enllaç.
    const graella = document.getElementById('reptes-graella');
    if (graella) {
      const nivells = [['a', '🟢 A · Fàcil'], ['b', '🟡 B · Mitjà'], ['c', '🔴 C · Difícil']];
      let t = '<h2 class="reptes-graella-titol">⚡ Reptes</h2>' +
              '<div class="reptes-graella-scroll"><table class="reptes-graella">' +
              '<thead><tr><th scope="col">Tema</th>' +
              nivells.map(n => `<th scope="col">${n[1]}</th>`).join('') + '</tr></thead><tbody>';
      for (const tema of TEMES_DATA) {
        t += `<tr><th scope="row"><span class="reptes-graella-num">${tema.num}</span> ${tema.titol}</th>`;
        for (const n of nivells) {
          const r = REPTES_DATA.find(x => x.tema === tema.num && x.nivell === n[0]);
          if (!r) { t += '<td class="reptes-graella-buida"></td>'; continue; }
          const done = r.goalId && progress[r.goalId];
          t += `<td><a href="${r.arxiu}"${done ? ' class="fet"' : ''}>` +
               `<span class="reptes-graella-id">${r.id.toUpperCase()}${done ? ' ✓' : ''}</span>` +
               `${r.titol}</a></td>`;
        }
        t += '</tr>';
      }
      graella.innerHTML = t + '</tbody></table></div>';
    }
    })();

  }
</script>

</body>
</html>
